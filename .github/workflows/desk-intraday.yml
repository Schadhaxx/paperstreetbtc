name: desk-intraday
# Desk weekly candles: refresh ONLY the in-progress week, every 15 min
# while NYSE is open, plus one final run after the close. This file is
# separate from prices.yml so its */15 cron cannot fire the prices
# fetch job (a duplicate fetch run would queue in prices-data and
# GitHub could cancel a real price/recap run).
#
# NOTE: this file cannot be pushed by the GitHub App (it returns 403
# on workflow files). It is added via GitHub web edit as Schadhaxx,
# outside 9:30 AM-4:30 PM ET so it does not fire on the next 15-min
# tick. Do not merge the code branch without it — the job would not
# exist.
on:
  schedule:
    - cron: '7,37 13-21 * * 1-5'   # every 30 min at :07/:37, 13:00-21:59 UTC Mon-Fri; covers 9:30 AM-4:45 PM ET in EST and EDT (in-job gate is the real control). Sunil approved 1:00 PM ET Nov 9.
  workflow_dispatch:
permissions: {}
jobs:
  desk-intraday:
    # Writes Desk *-weekly.json files on main ONLY — never
    # prices.json / history.json. The cron fires 13:00-21:59 UTC Mon-Fri,
    # which covers 9:30 AM-4:30 PM ET in both EST (UTC-5) and EDT
    # (UTC-4); the in-job gate (America/New_York, holidays + early
    # closes in tools/desk_intraday.py) is the real control and skips
    # weekends, NYSE holidays, early-close afternoons, and out-of-hours
    # ticks.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: desk-intraday
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2, pinned
        with:
          ref: main
          fetch-depth: 0
      - name: Market-hours gate (America/New_York; holidays + early closes in tools/desk_intraday.py)
        id: gate
        run: |
          python3 tools/desk_intraday.py --gate | tee /tmp/gate.txt
          grep '^run=' /tmp/gate.txt >> "$GITHUB_OUTPUT"
      # If this step fails (more than 3 symbols failed, two Yahoo 429s in
      # a row, or a critical file error), the run fails here and the push
      # step below is skipped — a failed run never publishes a partial
      # refresh. The good symbols are re-fetched on the next 15-min tick.
      - name: Refresh Desk weekly candles (current week only, fail closed per symbol)
        if: steps.gate.outputs.run == '1'
        run: |
          # --live-json also writes the one small current-week candle file
          # for every Desk symbol (desk-live.json, option b), built from the
          # same validated candles, outside the repo checkout.
          python3 tools/desk_intraday.py --out-dir assets/data --live-json "${RUNNER_TEMP:-/tmp}/desk-live.json"
      # 5-minute Desk (option b): publish desk-live.json to the `data`
      # branch next to prices.json (raw.githubusercontent, no Pages build).
      # Only that one file is ever committed there; prices.yml owns every
      # other data-branch file. continue-on-error: a failed publish never
      # blocks the main commit below; the page ignores a stale file
      # (asOf too old) and keeps the Pages weekly candle.
      - name: Publish desk-live.json to the data branch (validated; rebase + retry, never force)
        id: live
        if: steps.gate.outputs.run == '1'
        continue-on-error: true
        run: |
          set -e
          LIVE="${RUNNER_TEMP:-/tmp}/desk-live.json"
          python3 tools/desk_intraday.py --validate-live "$LIVE"
          DW="${RUNNER_TEMP:-/tmp}/data-work"
          git worktree remove --force "$DW" 2>/dev/null || true
          rm -rf "$DW"; git worktree prune
          git fetch -q origin +refs/heads/data:refs/remotes/origin/data
          git worktree add -q --detach "$DW" origin/data
          cp "$LIVE" "$DW/desk-live.json.tmp" && mv "$DW/desk-live.json.tmp" "$DW/desk-live.json"
          cd "$DW"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          other=$(git status --porcelain | grep -v ' desk-live.json$' | head -1 || true)
          if [ -n "$other" ]; then echo "::error::data worktree has an unexpected change: $other"; exit 1; fi
          git add -- desk-live.json
          if git diff --cached --quiet; then echo "desk-live.json unchanged"; echo "published=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -q -m "desk-live: current-week candles $(date -u +%FT%TZ)"
          for wait in 0 5 15 30; do
            sleep $wait
            if git push -q origin HEAD:data; then echo "published=1" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "data push rejected; rebasing onto origin/data (never force-push)"
            git fetch -q origin +refs/heads/data:refs/remotes/origin/data
            git rebase -q origin/data || { git rebase --abort || true; echo "::error::rebase conflict on the data branch; desk-live.json not published"; exit 1; }
            changed=$(git diff --name-only origin/data HEAD)
            if [ "$changed" != "desk-live.json" ]; then echo "::error::desk-live commit would change: $changed"; exit 1; fi
          done
          echo "::error::desk-live push failed after 4 tries"; exit 1
      - name: Commit Desk data only and push (fast-forward only, rebase + retry)
        id: push
        if: steps.gate.outputs.run == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Safety: this job must never touch anything but the Desk weekly files.
          outside=$(git status --porcelain -- ':!assets/data' | head -1)
          if [ -n "$outside" ]; then echo "::error::unexpected change outside assets/data: $outside"; exit 1; fi
          for f in $(git status --porcelain -- assets/data | awk '{print $2}'); do
            case "$f" in
              assets/data/stock-weekly-*.json|assets/data/wti-weekly.json|assets/data/gold-weekly.json|assets/data/us10y-weekly.json|assets/data/vix-weekly.json|assets/data/dia-weekly.json|assets/data/qqq-weekly.json|assets/data/usdcad-weekly.json|assets/data/dxy-weekly.json) ;;
              *) echo "::error::desk-intraday would touch $f, refusing"; exit 1;;
            esac
          done
          git add -- assets/data/stock-weekly-*.json assets/data/wti-weekly.json assets/data/gold-weekly.json assets/data/us10y-weekly.json assets/data/vix-weekly.json assets/data/dia-weekly.json assets/data/qqq-weekly.json assets/data/usdcad-weekly.json assets/data/dxy-weekly.json
          if git diff --cached --quiet; then
            echo "no Desk changes; nothing to commit"
            exit 0
          fi
          git commit -q -m "desk: intraday refresh $(date -u +%FT%TZ)"
          for wait in 0 5 15 30; do
            sleep $wait
            if git push -q origin HEAD:main; then echo "pushed=1" >> $GITHUB_OUTPUT; exit 0; fi
            echo "push rejected or failed; rebasing onto origin/main (never force-push)"
            git fetch -q origin main && { git rebase -q origin/main || { git rebase --abort; echo "rebase conflict"; exit 1; }; }
          done
          echo "push failed after 4 tries"; exit 1
      # Pushes with the Actions token do not reliably deploy, so request a
      # Pages build explicitly (same step as the recap job in prices.yml).
      - name: Trigger Pages build (retries)
        id: pages
        if: steps.push.outputs.pushed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wait in 0 10 30; do sleep $wait; if gh api -X POST repos/${{ github.repository }}/pages/builds --jq .status; then echo "ok=1" >> $GITHUB_OUTPUT; exit 0; fi; done
          echo "::warning::Pages build request failed 3 times; the change IS on main and will deploy with the next Pages build"; exit 0
      - name: Summary
        if: always()
        run: |
          {
            echo "### Desk intraday refresh: ${{ job.status }}"
            if [ "${{ steps.live.outputs.published }}" = "1" ]; then echo "- desk-live.json published to the data branch."
            elif [ "${{ steps.live.outcome }}" = "failure" ]; then echo "- **desk-live.json publish failed** (page falls back to the Pages weekly candle)."
            fi
            if [ "${{ steps.push.outputs.pushed }}" = "1" ]; then
              echo "- Changed and pushed to main: $(git log -1 --format='%h %s')"
              [ "${{ steps.pages.outputs.ok }}" = "1" ] && echo "- Pages build requested." || echo "- **Pages build request failed**: the change is on main but may not be live until the next Pages build."
            elif [ "${{ steps.gate.outputs.run }}" = "0" ]; then echo "- Outside market hours (gate skipped the run)."
            else echo "- No Desk changes; nothing to commit."
            fi
          } >> $GITHUB_STEP_SUMMARY
