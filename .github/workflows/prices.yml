name: prices
on:
  schedule:
    - cron: '*/5 * * * 1-5'   # Mon-Fri UTC
    - cron: '*/5 0-1 * * 6'   # Sat 00:00-01:59 UTC = Fri evening ET
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even outside market hours'
        default: 'false'
permissions:
  contents: write
concurrency:
  group: prices
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Market-hours gate (America/New_York, weekdays 03:55-20:15)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then echo "run=1" >> $GITHUB_OUTPUT; exit 0; fi
          d=$(TZ=America/New_York date +%u); h=$(TZ=America/New_York date +%-H); m=$(TZ=America/New_York date +%-M)
          mins=$((h*60+m))
          if [ "$d" -le 5 ] && [ $mins -ge 235 ] && [ $mins -le 1215 ]; then echo "run=1" >> $GITHUB_OUTPUT; else echo "run=0" >> $GITHUB_OUTPUT; echo "Outside window"; fi
      - name: Checkout data branch
        if: steps.gate.outputs.run == '1'
        run: |
          git init -q work && cd work
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin data; then git checkout -q -b data FETCH_HEAD; else git checkout -q --orphan data; fi
      - name: Fetch prices
        if: steps.gate.outputs.run == '1'
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          EVT: ${{ github.event_name }}
        run: |
          cd work
          python3 - <<'PY'
          import json, os, urllib.request, datetime
          def get(u):
              r = urllib.request.Request(u, headers={'User-Agent': 'paperstreetbtc-cache'})
              with urllib.request.urlopen(r, timeout=15) as f: return json.load(f)
          now = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          try: old = json.load(open('prices.json'))
          except Exception: old = {}
          out = {'updated': now, 'btc': old.get('btc'), 'stocks': dict(old.get('stocks') or {})}
          key = os.environ.get('FINNHUB_API_KEY', '')
          ok = 0
          for s in ['MSTR','STRC','TSLA','PLTR','SPY','QQQ','BRK.B']:
              try:
                  q = get(f'https://finnhub.io/api/v1/quote?symbol={s}&token={key}')
                  if isinstance(q.get('c'), (int, float)) and q['c'] > 0:
                      out['stocks'][s] = {'c': q['c'], 'pc': q.get('pc'), 't': q.get('t')}; ok += 1
                  else: print(s, 'bad data, keeping previous')
              except Exception as e: print(s, 'failed, keeping previous:', type(e).__name__)
          try:
              b = get('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd&include_24hr_change=true')['bitcoin']
              out['btc'] = {'usd': b['usd'], 'chg24h': b.get('usd_24h_change'), 'src': 'CoinGecko', 'time': now}
          except Exception as e:
              print('CoinGecko failed:', type(e).__name__)
              try:
                  a = float(get('https://api.coinbase.com/v2/prices/BTC-USD/spot')['data']['amount'])
                  out['btc'] = {'usd': a, 'chg24h': None, 'src': 'Coinbase', 'time': now}
              except Exception as e2: print('Coinbase failed, keeping previous:', type(e2).__name__)
          out['gold'] = old.get('gold')
          try:
              q = get('https://forex-data-feed.swissquote.com/public-quotes/bboquotes/instrument/XAU/USD')[0]['spreadProfilePrices'][0]
              out['gold'] = {'usd': round((q['bid'] + q['ask']) / 2, 2), 'src': 'Swissquote spot XAU/USD', 'time': now}
          except Exception as e:
              print('Swissquote gold failed:', type(e).__name__)
              try:
                  out['gold'] = {'usd': float(get('https://api.gold-api.com/price/XAU')['price']), 'src': 'gold-api.com spot XAU', 'time': now}
              except Exception as e2: print('gold-api failed, keeping previous:', type(e2).__name__)
          # Month-end closes (last weekday of prior month, ET) for the site's Live/Month-end toggle; fetched once per month
          out['monthEnd'] = old.get('monthEnd')
          try:
              import zoneinfo
              t = datetime.datetime.now(zoneinfo.ZoneInfo('America/New_York')).date().replace(day=1) - datetime.timedelta(days=1)
              while t.weekday() > 4: t -= datetime.timedelta(days=1)
              md = t.isoformat()
              if not (out['monthEnd'] or {}).get('date') == md:
                  def yclose(sym):
                      p0 = int(datetime.datetime(t.year, t.month, t.day, tzinfo=datetime.timezone.utc).timestamp())
                      r = get(f'https://query1.finance.yahoo.com/v8/finance/chart/{sym}?period1={p0}&period2={p0+86400}&interval=1d')['chart']['result'][0]
                      return round(r['indicators']['quote'][0]['close'][-1], 4)
                  px = {k: yclose(y) for k, y in [('BTC','BTC-USD'),('MSTR','MSTR'),('STRC','STRC'),('TSLA','TSLA'),('PLTR','PLTR'),('SPY','SPY'),('QQQ','QQQ'),('BRK.B','BRK-B')]}
                  gld_now = get('https://query1.finance.yahoo.com/v8/finance/chart/GLD?range=1d&interval=1d')['chart']['result'][0]['meta']['regularMarketPrice']
                  if out.get('gold'): px['GOLD'] = round(yclose('GLD') * out['gold']['usd'] / gld_now, 2)  # spot via GLD oz/share
                  out['monthEnd'] = {'date': md, 'px': px}
          except Exception as e: print('monthEnd failed, keeping previous:', type(e).__name__)
          if ok == 0 and old: out['updated'] = old.get('updated', now)
          json.dump(out, open('prices.json', 'w'), indent=1)
          print('stocks ok:', ok, 'btc src:', (out['btc'] or {}).get('src'))
          ev = os.environ.get('EVT', '')
          rec = {'run': now, 'event': ev, 'trigger': 'cron-job.org' if ev == 'workflow_dispatch' else ('github-schedule' if ev == 'schedule' else ev),
                 'stocks_ok': ok, 'btc': out['btc'], 'gold': out.get('gold'), 'stocks': {k: v.get('c') for k, v in out['stocks'].items()}}
          open('runlog.jsonl', 'a').write(json.dumps(rec) + '\n')
          PY
      - name: Commit
        if: steps.gate.outputs.run == '1'
        run: |
          cd work
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json runlog.jsonl
          git commit -q -m "prices $(date -u +%FT%TZ)" || { echo nothing; exit 0; }
          git push -q origin HEAD:data
