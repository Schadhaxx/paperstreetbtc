name: prices
on:
  schedule:
    - cron: '*/5 * * * 1-5'   # Mon-Fri UTC
    - cron: '*/5 0-1 * * 6'   # Sat 00:00-01:59 UTC = Fri evening ET
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even outside market hours'
        default: 'false'
permissions: {}
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: prices-data
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      final_close: ${{ steps.finalc.outputs.final_close }}
    steps:
      - name: Market-hours gate (America/New_York, weekdays 03:55-21:30; the evening tail catches the 8 PM ET BTC close)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then echo "run=1" >> $GITHUB_OUTPUT; exit 0; fi
          d=$(TZ=America/New_York date +%u); h=$(TZ=America/New_York date +%-H); m=$(TZ=America/New_York date +%-M)
          mins=$((h*60+m))
          if [ "$d" -le 5 ] && [ $mins -ge 235 ] && [ $mins -le 1290 ]; then echo "run=1" >> $GITHUB_OUTPUT; else echo "run=0" >> $GITHUB_OUTPUT; echo "Outside window"; fi
      - name: Checkout data branch
        if: steps.gate.outputs.run == '1'
        run: |
          git init -q work && cd work
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          for wait in 0 5 15 30; do sleep $wait; if git fetch -q --depth 1 origin data; then git checkout -q -b data FETCH_HEAD; exit 0; fi; echo "fetch failed, retrying"; done
          # only start a fresh branch if the remote really has no data branch (never on a transient 5xx)
          if [ -z "$(git ls-remote --heads origin data)" ] && git ls-remote -q origin >/dev/null; then git checkout -q --orphan data; else echo "could not fetch data branch"; exit 1; fi
      - name: Fetch prices
        if: steps.gate.outputs.run == '1'
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          EVT: ${{ github.event_name }}
        run: |
          cd work
          python3 - <<'PY'
          import json, os, urllib.request, datetime
          def get(u, tries=3):
              import time as _t, urllib.error as _ue
              for i in range(tries):
                  try:
                      r = urllib.request.Request(u, headers={'User-Agent': 'paperstreetbtc-cache'})
                      with urllib.request.urlopen(r, timeout=15) as f: return json.load(f)
                  except _ue.HTTPError as e:
                      if e.code < 500 or i == tries - 1: raise
                  except (_ue.URLError, TimeoutError):
                      if i == tries - 1: raise
                  _t.sleep(3 * (i + 1))
          now = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          try: old = json.load(open('prices.json'))
          except Exception: old = {}
          out = {'updated': now, 'btc': old.get('btc'), 'stocks': dict(old.get('stocks') or {})}
          key = os.environ.get('FINNHUB_API_KEY', '')
          ok = 0
          for s in ['MSTR','STRC','TSLA','PLTR','SPY','QQQ','BRK.B','GLD']:
              try:
                  q = get(f'https://finnhub.io/api/v1/quote?symbol={s}&token={key}')
                  if isinstance(q.get('c'), (int, float)) and q['c'] > 0:
                      out['stocks'][s] = {'c': q['c'], 'pc': q.get('pc'), 't': q.get('t')}; ok += 1
                  else: print(s, 'bad data, keeping previous')
              except Exception as e: print(s, 'failed, keeping previous:', type(e).__name__)
          try:
              b = get('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd&include_24hr_change=true')['bitcoin']
              out['btc'] = {'usd': b['usd'], 'chg24h': b.get('usd_24h_change'), 'src': 'CoinGecko', 'time': now}
          except Exception as e:
              print('CoinGecko failed:', type(e).__name__)
              try:
                  a = float(get('https://api.coinbase.com/v2/prices/BTC-USD/spot')['data']['amount'])
                  out['btc'] = {'usd': a, 'chg24h': None, 'src': 'Coinbase', 'time': now}
              except Exception as e2: print('Coinbase failed, keeping previous:', type(e2).__name__)
          # --- monthend begin ---
          # Month-end closes for the site's Live/Month-end toggle (backfill-style: recomputed on any run whose cached date is not the correct one).
          # Target month = the month before the current America/New_York month (Oct 31 during the day -> Sep; from 00:00 ET Nov 1 -> Oct).
          # Stocks/ETFs (incl. GLD, BRK.B, SPY, QQQ): close of the last actual Yahoo daily bar dated (ET) <= the month's last calendar day.
          # BTC: Yahoo BTC-USD daily close of the last calendar day (UTC day bar, i.e. price at 00:00 UTC next day = 8 PM ET that day).
          import zoneinfo
          ET = zoneinfo.ZoneInfo('America/New_York')
          def me_target(now_utc):
              d = now_utc.astimezone(ET).date().replace(day=1) - datetime.timedelta(days=1)
              return d  # last calendar day of previous ET month
          def last_bar(r, last_day, tz):
              best = None
              for t, c in zip(r['timestamp'], r['indicators']['quote'][0]['close']):
                  if c is None: continue
                  dd = datetime.datetime.fromtimestamp(t, tz).date()
                  if dd <= last_day and (best is None or dd >= best[0]): best = (dd, c)
              return best
          def me_close(sym, last_day, fetch):
              p0 = int(datetime.datetime(last_day.year, last_day.month, last_day.day, tzinfo=datetime.timezone.utc).timestamp()) - 12 * 86400
              r = fetch(f'https://query1.finance.yahoo.com/v8/finance/chart/{sym}?period1={p0}&period2={p0 + 15 * 86400}&interval=1d')['chart']['result'][0]
              tz = datetime.timezone.utc if sym == 'BTC-USD' else ET
              return last_bar(r, last_day, tz)
          # --- monthend end ---
          out['monthEnd'] = old.get('monthEnd')
          try:
              L = me_target(datetime.datetime.now(datetime.timezone.utc))
              cur = out['monthEnd'] or {}
              if not (cur.get('month') == L.isoformat()[:7] and cur.get('v') == 3):
                  px, dates = {}, {}
                  for k, y in [('BTC','BTC-USD'),('MSTR','MSTR'),('STRC','STRC'),('TSLA','TSLA'),('PLTR','PLTR'),('SPY','SPY'),('QQQ','QQQ'),('BRK.B','BRK-B'),('GLD','GLD')]:
                      dd, c = me_close(y, L, get); px[k] = round(c, 4); dates[k] = dd.isoformat()
                  sess = max(v for k, v in dates.items() if k != 'BTC')
                  out['monthEnd'] = {'date': sess, 'month': L.isoformat()[:7], 'calendar_end': L.isoformat(), 'bar_dates': dates, 'px': px, 'v': 3}
          except Exception as e: print('monthEnd failed, keeping previous:', type(e).__name__)
          # --- history begin ---
          # Daily-closes history for the site's own ledger engine (history.json on the data branch).
          # Sessions = NYSE sessions (dates where Yahoo has a SPY daily bar, ET dates) from the 2025-12-31 base. Stocks/ETFs: Yahoo unadjusted daily close.
          # BTC: Yahoo BTC-USD UTC-day bar for the same calendar date (closes 00:00 UTC = 8 pm EDT / 7 pm EST); flagged provisional until 20 min after.
          # Yahoo briefly returns close=None for just-finished bars around 00:00 UTC. A null close for a finished day is a FEED GAP:
          #   fallbacks are tried (BTC: Coinbase daily candle, then CoinGecko; stocks: Yahoo chart meta regularMarketPrice for the latest session,
          #   then Finnhub quote, then Stooq CSV). If no source has it, the rebuild raises and the previous history.json is kept. Values are never invented.
          # New final closes are cross-checked against an independent source when one exists (BTC 0.5%, stocks 0.2%); disagreement keeps the previous file.
          import datetime as _dt, zoneinfo as _zi, csv as _csv, io as _io, urllib.request as _ur
          HIST_WARN = []
          NYSE_HOLIDAYS = {'2026-01-01','2026-01-19','2026-02-16','2026-04-03','2026-05-25','2026-06-19','2026-07-03','2026-09-07','2026-11-26','2026-12-25',
                           '2027-01-01','2027-01-18','2027-02-15','2027-03-26','2027-05-31','2027-06-18','2027-07-05','2027-09-06','2027-11-25','2027-12-24'}
          TOL = {'BTC': 0.005}; TOL_STOCK = 0.002
          class HistoryHold(ValueError): pass
          def _stooq(y, d):
              try:
                  r = _ur.Request(f'https://stooq.com/q/d/l/?s={y.lower().replace("-", ".")}.us&i=d', headers={'User-Agent': 'paperstreetbtc-cache'})
                  txt = _ur.urlopen(r, timeout=10).read().decode('utf-8', 'replace')
                  for row in _csv.DictReader(_io.StringIO(txt)):
                      if row.get('Date') == d and row.get('Close') not in (None, '', 'N/D'): return float(row['Close'])
              except Exception: pass
              return None
          def _coinbase_days(fetch, days):
              out = {}
              if not days: return out
              try:
                  a = min(days); b = (_dt.date.fromisoformat(max(days)) + _dt.timedelta(days=1)).isoformat()
                  for c in fetch(f'https://api.exchange.coinbase.com/products/BTC-USD/candles?granularity=86400&start={a}T00:00:00Z&end={b}T00:00:00Z'):
                      d = _dt.datetime.fromtimestamp(int(c[0]), _dt.timezone.utc).date().isoformat()   # candle start = UTC day; c[4] = close at 00:00 UTC next day
                      if d in days and float(c[4]) > 0: out[d] = round(float(c[4]), 6)
              except Exception as e: print('Coinbase candles failed:', type(e).__name__)
              return out
          def _coingecko_close(fetch, d):
              try:
                  n = _dt.date.fromisoformat(d) + _dt.timedelta(days=1)   # snapshot at 00:00 UTC of the next day = close of d
                  v = fetch(f'https://api.coingecko.com/api/v3/coins/bitcoin/history?date={n.strftime("%d-%m-%Y")}&localization=false')['market_data']['current_price']['usd']
                  return round(float(v), 6) if v and v > 0 else None
              except Exception as e: print('CoinGecko history failed:', type(e).__name__); return None
          def _agree(k, vals, d):
              """vals: list of (source, value) in priority order. Returns (value, source) or raises HistoryHold on disagreement."""
              vals = [(s, v) for s, v in vals if v is not None]
              if not vals: return None, None
              tol = TOL.get(k, TOL_STOCK); s0, v0 = vals[0]
              for s, v in vals[1:]:
                  if abs(v - v0) / v0 > tol:
                      msg = f'{k} {d}: {s0} {v0} vs {s} {v} differ {abs(v - v0) / v0:.2%} (> {tol:.1%}); kept previous history.json, nothing published'
                      HIST_WARN.append(msg); raise HistoryHold(msg)
              return v0, s0
          def build_history(fetch, now_utc, hold_prev=None, quotes=None, stooq=_stooq):
              ET_ = _zi.ZoneInfo('America/New_York'); base = _dt.date(2025, 12, 31)
              p0 = int(_dt.datetime(2025, 12, 15, tzinfo=_dt.timezone.utc).timestamp()); p1 = int(now_utc.timestamp()) + 2 * 86400
              SY = {'BTC': 'BTC-USD', 'MSTR': 'MSTR', 'STRC': 'STRC', 'TSLA': 'TSLA', 'PLTR': 'PLTR', 'SPY': 'SPY', 'QQQ': 'QQQ', 'BRK.B': 'BRK-B', 'GLD': 'GLD'}
              quotes = quotes or {}
              bars, nulls, meta, divs = {}, {}, {}, {}
              for k, y in SY.items():
                  r = fetch(f'https://query1.finance.yahoo.com/v8/finance/chart/{y}?period1={p0}&period2={p1}&interval=1d&events=div')['chart']['result'][0]
                  tz = _dt.timezone.utc if k == 'BTC' else ET_
                  b, nl = {}, set()
                  for t, c in zip(r.get('timestamp') or [], r['indicators']['quote'][0]['close']):
                      dd = _dt.datetime.fromtimestamp(t, tz).date().isoformat()
                      if c is None: nl.add(dd)
                      else: b[dd] = round(float(c), 6)
                  bars[k], nulls[k] = b, nl - set(b)
                  m = r.get('meta') or {}
                  if k != 'BTC' and m.get('regularMarketPrice') and m.get('regularMarketTime'):
                      mt = _dt.datetime.fromtimestamp(int(m['regularMarketTime']), ET_)
                      if (mt.hour, mt.minute) >= (16, 0): meta[k] = (mt.date().isoformat(), round(float(m['regularMarketPrice']), 6))   # only a closed session's price
                  if k in ('SPY', 'QQQ'):
                      divs[k] = {_dt.datetime.fromtimestamp(int(v['date']), ET_).date().isoformat(): round(float(v['amount']), 6)
                                 for v in ((r.get('events') or {}).get('dividends') or {}).values() if _dt.datetime.fromtimestamp(int(v['date']), ET_).date() > base}
              now_et = now_utc.astimezone(ET_); today_utc = now_utc.date().isoformat()
              sess = sorted(d for d in set(bars['SPY']) | nulls['SPY'] if d >= base.isoformat() and d not in NYSE_HOLIDAYS)   # a null SPY bar still marks a session
              if sess and sess[-1] == now_et.date().isoformat() and now_et.hour < 16: sess = sess[:-1]  # today's session not closed yet
              prevc = (hold_prev or {}).get('closes') or {}; prevprov = set((hold_prev or {}).get('btc_provisional') or [])
              if prevc and (not sess or max(prevc) > sess[-1]):
                  raise HistoryHold(f'rebuild would drop {max(prevc)} (Yahoo gap); keeping previous history')
              def final_btc(d): return now_utc >= _dt.datetime.fromisoformat(d).replace(tzinfo=_dt.timezone.utc) + _dt.timedelta(days=1, minutes=20)
              # dates whose values are NEW to the published file (cross-checked); older dates are already published and keep Yahoo's value
              new_stock = {d for d in sess if d not in prevc}
              new_btc = {d for d in sess if final_btc(d) and (d not in prevc or d in prevprov)}
              btc_gap = {d for d in sess if d < today_utc and d not in bars['BTC']}
              cb = _coinbase_days(fetch, sorted(new_btc | btc_gap))
              first = {k: min(bars[k]) if bars[k] else None for k in SY}
              closes, prov, last, srcs = {}, [], {}, {}
              for d in sess:
                  row = {}
                  for k in SY:
                      v, src = bars[k].get(d), 'yahoo'
                      if k == 'BTC':
                          if d < today_utc and (v is None or d in new_btc):
                              alt = [('yahoo', v), ('coinbase', cb.get(d))]
                              if v is None or cb.get(d) is None: alt.append(('coingecko', _coingecko_close(fetch, d)))
                              v, src = _agree('BTC', alt, d)
                              if v is None: raise HistoryHold(f'BTC {d}: Yahoo bar null and no fallback had it; keeping previous history')
                          elif v is None: v, src = last.get(k), 'ffill-provisional'   # current UTC day still running (provisional)
                      else:
                          listed = first[k] is not None and first[k] <= d
                          if v is None and not listed:
                              v, src = last.get(k), 'ffill-not-listed'
                          elif v is None or d in new_stock:
                              q = quotes.get(k) or {}
                              fh = q.get('c') if q.get('t') and _dt.datetime.fromtimestamp(int(q['t']), ET_).date().isoformat() == d else None
                              mv = meta[k][1] if k in meta and meta[k][0] == d else None
                              if v is None:
                                  alt = [('yahoo-meta', mv), ('finnhub', fh)]
                                  if mv is None and fh is None: alt.append(('stooq', stooq(SY[k], d)))
                              else: alt = [('yahoo', v), ('finnhub', fh)]
                              v, src = _agree(k, alt, d)
                              if v is None: raise HistoryHold(f'{k} {d}: Yahoo close null (trades that day) and no fallback had it; keeping previous history')
                      if v is None: raise HistoryHold(f'missing {k} {d}')
                      row[k] = v; last[k] = v
                      if src != 'yahoo': srcs.setdefault(d, {})[k] = src
                  closes[d] = row
                  if not final_btc(d): prov.append(d)
              for d, s in srcs.items(): print('history source', d, s)
              return {'v': 1, 'updated': now_utc.strftime('%Y-%m-%dT%H:%M:%SZ'), 'base': base.isoformat(), 'source': 'Yahoo Finance chart API (unadjusted close)',
                      'btc_provisional': prov, 'closes': closes, 'divs': divs, 'fallback_sources': srcs}
          def last_session(day):
              while day.weekday() >= 5 or day.isoformat() in NYSE_HOLIDAYS: day -= _dt.timedelta(days=1)
              return day
          def history_stale(h, now_utc):
              if not h or h.get('v') != 1 or not h.get('closes'): return True
              if now_utc.hour == 23 and now_utc.minute >= 55 or now_utc.hour == 0 and now_utc.minute < 20: return False   # UTC rollover window (7:55-8:20 PM EDT): Yahoo nulls bars
              ET_ = _zi.ZoneInfo('America/New_York'); n = now_utc.astimezone(ET_)
              lc = last_session(n.date() if n.hour >= 16 else n.date() - _dt.timedelta(days=1))
              if max(h['closes']) < lc.isoformat(): return True                                            # a closed session is missing (new close, or morning self-repair)
              if h.get('btc_provisional') and now_utc.minute % 30 < 5: return True                         # refresh provisional BTC every ~30 min
              for d in h.get('btc_provisional') or []:                                                     # its UTC day has ended: re-fetch until final
                  if now_utc >= _dt.datetime.fromisoformat(d).replace(tzinfo=_dt.timezone.utc) + _dt.timedelta(days=1, minutes=20): return True
              return False
          # --- history end ---
          # history.json: daily closes for the ledger engine (only rebuilt when stale)
          try: hold = json.load(open('history.json'))
          except Exception: hold = None
          try:
              nowu = datetime.datetime.now(datetime.timezone.utc)
              if history_stale(hold, nowu):
                  json.dump(build_history(get, nowu, hold, out['stocks']), open('history.json', 'w'), separators=(',', ':'))
                  print('history.json rebuilt')
          except Exception as e:
              print('history failed, keeping previous:', type(e).__name__, e)
              if isinstance(e, HistoryHold) and os.environ.get('GITHUB_STEP_SUMMARY'):
                  open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(('### :warning: history.json held\n' if HIST_WARN else '### history.json held (feed gap)\n') + f'- {e}\n')
          if ok == 0 and old: out['updated'] = old.get('updated', now)
          json.dump(out, open('prices.json', 'w'), indent=1)
          print('stocks ok:', ok, 'btc src:', (out['btc'] or {}).get('src'))
          ev = os.environ.get('EVT', '')
          rec = {'run': now, 'event': ev, 'trigger': 'cron-job.org' if ev == 'workflow_dispatch' else ('github-schedule' if ev == 'schedule' else ev),
                 'stocks_ok': ok, 'btc': out['btc'], 'stocks': {k: v.get('c') for k, v in out['stocks'].items()}}
          open('runlog.jsonl', 'a').write(json.dumps(rec) + '\n')
          PY
      - name: Final-close check (decides whether the recap job runs)
        id: finalc
        if: steps.gate.outputs.run == '1'
        run: |
          cd work
          git show HEAD:history.json > /tmp/hist_old.json 2>/dev/null || echo '{}' > /tmp/hist_old.json
          curl -fsS --retry 3 --retry-delay 5 "https://raw.githubusercontent.com/${{ github.repository }}/main/recap/months.js?t=$(date +%s)" -o /tmp/months.js || echo "" > /tmp/months.js
          curl -fsS --retry 3 --retry-delay 5 "https://raw.githubusercontent.com/${{ github.repository }}/main/assets/data/btc-daily.json?t=$(date +%s)" | python3 -c "import json,sys;print(json.load(sys.stdin)['end'])" > /tmp/bd_end || echo "" > /tmp/bd_end
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re, datetime as dt
          def lastf(p):
              try:
                  h = json.load(open(p)); pv = set(h.get('btc_provisional') or [])
                  return max(d for d in h['closes'] if d not in pv)
              except Exception: return ''
          old, new = lastf('/tmp/hist_old.json'), lastf('history.json')
          mj = open('/tmp/months.js').read()
          e = re.search(r"\{slug:'%s',title:'([^']*)'" % new[:7], mj) if new else None
          t = re.search(r'through ([A-Z][a-z]{2} \d+, \d{4})', e.group(1)) if e else None
          thru = dt.datetime.strptime(t.group(1), '%b %d, %Y').date().isoformat() if t else ''
          lag = bool(new) and (e is None or ('month to date' in e.group(1) and thru < new))
          now = dt.datetime.now(dt.timezone.utc); bd_end = open('/tmp/bd_end').read().strip()
          last_final_day = (now - dt.timedelta(minutes=20)).date() - dt.timedelta(days=1)   # newest UTC day that is final
          bd_lag = bool(bd_end) and bd_end < last_final_day.isoformat()
          flag = '1' if (new and (new > old or lag)) or bd_lag else '0'
          print('final_close=' + flag)
          import sys; print(f'newest final close: before {old or "-"}, now {new or "-"}; recap lagging: {lag}; btc-daily end {bd_end} lagging: {bd_lag}; final_close={flag}', file=sys.stderr)
          PY
      - name: Commit
        if: steps.gate.outputs.run == '1'
        run: |
          cd work
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json runlog.jsonl history.json
          git commit -q -m "prices $(date -u +%FT%TZ)" || { echo nothing; exit 0; }
          echo 'runlog.jsonl merge=union' >> .git/info/attributes
          for wait in 0 5 15 30; do
            sleep $wait
            if git push -q origin HEAD:data; then exit 0; fi
            echo "push rejected, rebasing and retrying (next wait after ${wait}s)"
            if ! git pull -q --rebase origin data; then
              # newest prices.json (this run) wins; runlog.jsonl keeps both lines via union merge
              # prices.json: this run's snapshot wins. history.json: merge by date (newer 'updated' wins per date, union of dates).
              git checkout --theirs prices.json
              if git ls-files -u history.json | grep -q .; then
                git show :2:history.json > /tmp/h_up.json && git show :3:history.json > /tmp/h_me.json && python3 - <<'PY'
          import json
          a, b = json.load(open('/tmp/h_up.json')), json.load(open('/tmp/h_me.json'))
          new, old = (b, a) if b.get('updated', '') >= a.get('updated', '') else (a, b)
          m = dict(new); m['closes'] = {**old.get('closes', {}), **new.get('closes', {})}
          m['divs'] = {k: {**old.get('divs', {}).get(k, {}), **v} for k, v in new.get('divs', {}).items()}
          m['btc_provisional'] = [d for d in new.get('btc_provisional', []) if d in m['closes']]
          json.dump(m, open('history.json', 'w'), separators=(',', ':'))
          PY
              fi
              git add prices.json runlog.jsonl history.json && GIT_EDITOR=true git rebase --continue || { git rebase --abort; echo "rebase failed"; }
            fi
          done
          echo "data push failed after 4 tries"; exit 1

  recap:
    # Keeps main's recap (current month page + index card) and assets/data/btc-daily.json current from FINAL closes.
    # Separate job: it can never block or fail the price update above.
    needs: fetch
    if: always() && needs.fetch.result == 'success' && needs.fetch.outputs.final_close == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pages: write
    concurrency:
      group: recap-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Build in a staging copy, validate and test, then move into place
        id: gen
        run: |
          for wait in 0 5 15 30; do sleep $wait; git fetch -q origin data && break; echo "fetch failed, retrying"; done
          git show FETCH_HEAD:history.json > /tmp/history.json
          rm -rf /tmp/stage && cp -a . /tmp/stage
          ( cd /tmp/stage && python3 tools/btc_daily.py ) || echo "::warning::btc-daily update skipped (see log); recap continues"
          ( cd /tmp/stage && python3 tools/recap_gen.py --history /tmp/history.json --repo . )
          ( cd /tmp/stage && python3 tests/test_recap.py --history /tmp/history.json --repo . > /tmp/test.log ) || { tail -40 /tmp/test.log; echo "Checks failed in staging; nothing moved into place, live site unchanged."; exit 1; }
          tail -1 /tmp/test.log
          changed=0
          for f in assets/data/btc-daily.json recap/months.js $(cd /tmp/stage && ls recap/20*/index.html); do
            if ! cmp -s "/tmp/stage/$f" "$f"; then mkdir -p "$(dirname "$f")"; cp "/tmp/stage/$f" "$f.tmp" && mv "$f.tmp" "$f"; echo "updated $f"; changed=1; fi
          done
          echo "changed=$changed" >> $GITHUB_OUTPUT
      - name: Commit and push (fast-forward only, retries)
        id: push
        if: steps.gen.outputs.changed == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- recap/ assets/data/btc-daily.json
          git commit -q -m "recap/btc-daily: refresh from final closes $(date -u +%FT%TZ)"
          for wait in 0 5 15 30; do
            sleep $wait
            if git push -q origin HEAD:main; then echo "pushed=1" >> $GITHUB_OUTPUT; exit 0; fi
            echo "push rejected or failed; rebasing onto origin/main"
            git fetch -q origin main && { git rebase -q origin/main || { git rebase --abort; echo "rebase conflict"; exit 1; }; }
          done
          echo "push failed after 4 tries"; exit 1
      - name: Trigger Pages build (retries)
        id: pages
        if: steps.push.outputs.pushed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wait in 0 10 30; do sleep $wait; if gh api -X POST repos/${{ github.repository }}/pages/builds --jq .status; then echo "ok=1" >> $GITHUB_OUTPUT; exit 0; fi; done
          echo "::warning::Pages build request failed 3 times; the change IS on main and will deploy with the next Pages build"; exit 0
      - name: Summary
        if: always()
        run: |
          {
            echo "### Recap refresh: ${{ job.status }}"
            if [ "${{ steps.push.outputs.pushed }}" = "1" ]; then
              echo "- Changed and pushed to main: $(git log -1 --format='%h %s')"
              [ "${{ steps.pages.outputs.ok }}" = "1" ] && echo "- Pages build requested." || echo "- **Pages build request failed**: the page changed on main but may not be live until the next Pages build."
            elif [ "${{ steps.gen.outputs.changed }}" = "0" ]; then echo "- No change needed."
            else echo "- Nothing was pushed; the live recap stays on its last good version. See step logs (failure, timeout or cancel)."; fi
          } >> $GITHUB_STEP_SUMMARY
