<script>(function(){var u=function(x){return '$'+x.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});},f=function(x){return (x>=0?'+':'')+x.toFixed(2)+'%';},
c=function(x){return x>=0?'#34d399':'#f87171';},dd=function(d){return new Date(d+'T12:00:00Z').toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'});};
document.getElementById('list').innerHTML=RECAP_MONTHS.slice().sort(function(a,b){return b.slug.localeCompare(a.slug);}).map(function(m){var b=m.btc;
 return '<a class="rc" href="'+m.slug+'/index.html"><h2>'+m.title+'</h2><p>'+m.blurb+'</p>'+(b?'<div class="rc-b"><span>BTC <b>'+u(b.open)+' → '+u(b.close)+'</b> <b style="color:'+c(b.chg)+'">'+f(b.chg)+'</b></span><span>High close '+u(b.hi)+' ('+dd(b.hid)+') · Low close '+u(b.lo)+' ('+dd(b.lod)+')</span></div>':'')
  +(m.sl?'<div class="rc-s">'+m.sl.map(function(s){return '<span>'+s.n+' <b style="color:'+c(s.m)+'">'+f(s.m)+'</b></span>';}).join('')+'</div>':'')+'<span class="rc-go">Full recap →</span></a>';}).join('');})();</script>
<style>.rc{display:block}.rc-b{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.9rem;color:#cbd5e1;margin:8px 0}.rc-s{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem;color:#94a3b8}.rc-go{display:inline-block;margin-top:10px;color:#22d3ee;font-weight:600;font-size:.9rem}</style>
