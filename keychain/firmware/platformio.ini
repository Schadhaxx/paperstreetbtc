; PaperStreet Keychain — PlatformIO build (alternative to Arduino IDE)
; Usage: copy this whole folder, then run `pio run -t upload`.
; The sketch file goes in src/ (PlatformIO layout):
;   mkdir -p src && cp paperstreet-keychain.ino src/
; User_Setup.h is NOT used by this PlatformIO build — the display
; setup is carried by the -D flags below instead (this is the
; documented TFT_eSPI method for PlatformIO: USER_SETUP_LOADED
; tells the library to take its setup from these flags, not from
; a User_Setup.h file). The -D flags mirror User_Setup.h exactly;
; if you change one, change the other.
; PSRAM is enabled here because the daily history file is parsed in RAM.

[env:lilygo-t-display-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.psram_type = opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
; Smooth fonts live in data/ (LittleFS) — upload them with
; `pio run -t uploadfs` after flashing the sketch.
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps =
  bodmer/TFT_eSPI@^2.5.0
  bblanchon/ArduinoJson@^7.0.0
build_flags =
  -DUSER_SETUP_LOADED
  -DST7789_DRIVER
  -DINIT_SEQUENCE_3
  -DCGRAM_OFFSET
  -DTFT_RGB_ORDER=TFT_RGB
  -DTFT_INVERSION_ON
  -DTFT_PARALLEL_8_BIT
  -DTFT_WIDTH=170
  -DTFT_HEIGHT=320
  -DTFT_CS=6
  -DTFT_DC=7
  -DTFT_RST=5
  -DTFT_WR=8
  -DTFT_RD=9
  -DTFT_D0=39
  -DTFT_D1=40
  -DTFT_D2=41
  -DTFT_D3=42
  -DTFT_D4=45
  -DTFT_D5=46
  -DTFT_D6=47
  -DTFT_D7=48
  -DTFT_BL=38
  -DTFT_BACKLIGHT_ON=1
  -DLOAD_GLCD
  -DLOAD_FONT2
  -DLOAD_FONT4
  -DLOAD_FONT6
  -DLOAD_FONT7
  -DLOAD_FONT8
  -DLOAD_GFXFF
  -DSMOOTH_FONT
