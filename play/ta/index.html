<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#05070f">
<title>TA pill play models (prototype)</title>
<style>
:root{--f:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:#05070f;color:#e2e8f0;font-family:var(--f);-webkit-text-size-adjust:100%}
body{position:relative;min-height:100vh;min-height:100dvh}
#app{position:absolute;left:0;top:0;overflow:hidden;display:flex;flex-direction:column;
  background:radial-gradient(120% 55% at 100% 0%,rgba(120,72,20,.35) 0%,rgba(5,7,15,0) 60%),#05070f;
  font-size:13px;line-height:1.25;-webkit-font-smoothing:antialiased}
#app.fill{width:100%;height:100vh;height:100dvh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app.frame{transform-origin:0 0;border-radius:34px;border:1px solid #1e293b}
#app button{font:inherit;color:inherit;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app.l{flex-direction:row}

/* prototype switches */
.bar{flex:0 0 auto;padding:8px 12px 0}
.b1{display:flex;gap:6px;align-items:center}
.apz,.orz{display:flex;gap:3px;padding:2px;border:1px solid #1e293b;border-radius:14px;background:#0a0f1c}
.apz{flex:1 1 auto;min-width:0}
.ab{flex:1 1 0;min-width:44px;height:44px;border:0;border-radius:11px;background:none;color:#94a3b8;font-weight:600;font-size:12.5px;white-space:nowrap;padding:0 2px}
.ab b{color:#e2e8f0;font-weight:800}
.ab.on{background:#22d3ee;color:#041018}.ab.on b{color:#041018}
.orz{flex:0 0 auto}
.ob{width:44px;height:44px;border:0;border-radius:11px;background:none;display:inline-flex;align-items:center;justify-content:center;color:#94a3b8;padding:0}
.ob.on{background:#22d3ee;color:#041018}
.ob i{display:block;border:2px solid currentColor;border-radius:4px}
.ob .ip{width:12px;height:20px}.ob .il{width:20px;height:12px}
.desc{margin:5px 2px 0;font-size:11.5px;line-height:1.3;color:#94a3b8;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.desc b{color:#e2e8f0}
@media (max-width:380px){#app.fill.p .ab span{display:none}}
.rail{flex:0 0 auto;width:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:6px 4px 6px 6px}
.rail .apz,.rail .orz{flex-direction:column;flex:0 0 auto}
.rail .ab{flex:0 0 auto;width:44px}
.rail .ab span{display:none}
.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}

/* site header */
.hd{flex:0 0 auto;padding:8px 16px 2px}
.br{display:flex;align-items:center;gap:8px;font-size:18px;white-space:nowrap;min-width:0}
.br b{font-weight:700;color:#f1f5f9}.br em{font-style:normal;color:#22d3ee}
.lg{flex:0 0 auto;width:28px;height:28px;border-radius:8px;background:#0e7490;color:#e0f7fb;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.mut{color:#94a3b8;font-weight:500}
.lv{display:flex;align-items:center;gap:7px;height:44px;font-size:11.5px;font-weight:700;letter-spacing:.06em;white-space:nowrap}
.sp{flex:1 1 auto}
.dot{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55e}
.ok{color:#22c55e;font-size:11.5px;font-weight:700;letter-spacing:.06em;white-space:nowrap}
.keep{position:relative;isolation:isolate;flex:0 0 auto;height:44px;min-width:44px;padding:0 12px;border:0;background:none;color:#94a3b8 !important;font-size:11.5px !important;font-weight:700 !important;white-space:nowrap}
.keep::before{content:"";position:absolute;z-index:-1;left:0;right:0;top:7px;bottom:7px;border-radius:999px;border:1px solid #334155}
.keep.on{color:#22d3ee !important}.keep.on::before{border-color:#22d3ee;background:rgba(34,211,238,.08)}
.dr{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:2px 8px;min-height:24px}
.dt{font-size:17px;font-weight:700;white-space:nowrap}
@media (max-width:380px){#app.fill.p .dt{font-size:15px}}
.proto{flex:0 0 auto;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fbbf24;border:1px solid rgba(251,191,36,.4);border-radius:999px;padding:3px 8px;white-space:nowrap}
.l .hd{display:flex;align-items:center;gap:8px;height:46px;padding:0 12px 0 2px}
.l .br{font-size:15px}.l .lg{width:24px;height:24px;font-size:13px}
.l .dt{font-size:13px;color:#cbd5e1}

/* chart card */
.card{flex:1 1 auto;min-height:0;margin:4px 12px 12px;padding:12px 12px 6px;border-radius:22px;border:1px solid rgba(34,211,238,.28);
  background:linear-gradient(180deg,#0d1526 0%,#080d1a 100%);display:flex;flex-direction:column;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.l .card{flex-direction:row;gap:12px;margin:0 8px 8px 0;padding:6px 10px}
.lc{flex:0 0 250px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.rc{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.pl{font-size:11px;font-weight:700;letter-spacing:.14em;color:#94a3b8;text-transform:uppercase}
.px{font-size:66px;font-weight:800;letter-spacing:-.04em;line-height:1;margin-top:6px;color:#f8fafc;white-space:nowrap}
.px span{color:#22d3ee}
.l .px{font-size:52px}
.cg{margin-top:6px;font-size:14px}
.l .cg{font-size:13px}
.dn{color:#ef4444;font-weight:700}.up{color:#22c55e;font-weight:700}

/* control rows: every button is a 44px box; the pill you see is drawn inside it */
.row{display:flex;align-items:center;gap:6px;min-width:0;margin-top:6px}
.row+.row{margin-top:0}
.l .row{margin-top:0}
.lane{display:flex;align-items:center;gap:6px;overflow-x:auto;overflow-y:hidden;flex:1 1 auto;min-width:0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.lane::-webkit-scrollbar{display:none}
.fade{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 22px),transparent);padding-right:18px}
.grp{display:flex;gap:6px;flex:0 0 auto}
.ch{position:relative;isolation:isolate;flex:0 0 auto;height:44px;min-width:44px;padding:0 13px;border:0;background:none;color:#cbd5e1;font-weight:600;font-size:13px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.ch::before{content:"";position:absolute;z-index:-1;left:0;right:0;top:3px;bottom:3px;border-radius:999px;border:1px solid #1e293b}
.l .ch{font-size:12px;padding:0 11px}
.l .ch::before{top:6px;bottom:6px}
.ch.on{color:#041018}.ch.on::before{background:#22d3ee;border-color:#22d3ee}
.ch.as{color:#64748b}
.ch.as.on{color:#e2e8f0}.ch.as.on::before{background:rgba(148,163,184,.06);border-color:#334155}
.ch i{width:12px;height:3px;border-radius:2px;display:block}
.ch svg{width:9px;height:9px;display:block;transition:transform .15s}
.ch.open svg{transform:rotate(180deg)}
.ch.ta.act{color:#e2e8f0}.ch.ta.act::before{border-color:rgba(34,211,238,.55)}
.ch.ta.open,.ch.typ.open{color:#22d3ee}.ch.ta.open::before,.ch.typ.open::before{border-color:#22d3ee;background:rgba(34,211,238,.08)}
.ch.typ{color:#e2e8f0}.ch.typ::before{border-color:#334155}
.n{font-style:normal;display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 5px;border-radius:999px;background:#22d3ee;color:#041018;font-size:10.5px;font-weight:700}
.dv{flex:0 0 1px;align-self:stretch;margin:10px 2px;background:#1e293b}
.tw{position:relative;flex:0 0 auto;display:inline-flex}
.chips{display:flex;align-items:center;gap:6px;flex:1 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.ac{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:600;color:#cbd5e1;background:rgba(148,163,184,.08);border:1px solid #1e293b;white-space:nowrap}
.ac i{width:10px;height:2px;border-radius:2px;display:block}

/* TA panel */
.pn{position:absolute;top:calc(100% + 2px);right:0;z-index:30;width:292px;padding:0 12px 6px;border-radius:16px;background:rgba(8,13,28,.97);
  border:1px solid rgba(34,211,238,.3);box-shadow:0 18px 40px rgba(0,0,0,.55);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;text-align:left}
.ph{display:flex;justify-content:space-between;align-items:center;height:44px}
.ph b{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#94a3b8}
.ph button{height:44px;min-width:44px;border:0;background:none;color:#22d3ee !important;font-weight:600;font-size:12.5px;padding:0 0 0 14px}
.pg{display:flex;flex-direction:column}
.it{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;min-height:48px;border:0;border-top:1px solid rgba(148,163,184,.12);background:none;padding:4px 0;text-align:left}
.pg>.it:first-child{border-top:0}
.nm{display:flex;flex-direction:column;gap:2px;min-width:0}
.nm span{font-weight:600;color:#e2e8f0;display:flex;align-items:center;gap:7px;font-size:13px;white-space:nowrap}
.nm span i{width:12px;height:3px;border-radius:2px;display:block}
.nm small{font-size:10.5px;color:#64748b}
.sw{flex:0 0 auto;width:40px;height:24px;border-radius:999px;background:#1e293b;position:relative;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#94a3b8;transition:left .15s}
.sw.on{background:#22d3ee}.sw.on::after{left:19px;background:#041018}
.ma{display:flex;justify-content:space-between;gap:6px;padding:0 0 6px}
.seg{display:inline-flex;border:1px solid #1e293b;border-radius:999px;padding:0 2px}
.seg button{position:relative;isolation:isolate;height:44px;min-width:44px;padding:0 10px;border:0;background:none;color:#94a3b8 !important;font-weight:600;font-size:12px}
.seg button::before{content:"";position:absolute;z-index:-1;left:0;right:0;top:6px;bottom:6px;border-radius:999px}
.seg button.on{color:#041018 !important}.seg button.on::before{background:#22d3ee}
.ma.off .seg{opacity:.45}
.l .pn{width:384px;padding:0 10px 4px}
.l .pg{display:grid;grid-template-columns:1fr 1fr;column-gap:14px}
.l .pg>.it:nth-child(2){border-top:0}
.l .it{min-height:44px}
.l .nm small{display:none}
.l .ma{grid-column:1/-1;order:9;padding:0 0 4px;border-top:1px solid rgba(148,163,184,.12)}
.tm{position:absolute;top:calc(100% + 2px);right:0;z-index:30;width:160px;padding:4px;border-radius:14px;background:rgba(8,13,28,.97);border:1px solid rgba(34,211,238,.3);box-shadow:0 18px 40px rgba(0,0,0,.55)}
.tmi{display:flex;width:100%;justify-content:space-between;align-items:center;height:44px;padding:0 12px;border:0;background:none;border-radius:10px;font-weight:600;font-size:13px;color:#cbd5e1 !important}
.tmi.on{color:#22d3ee !important;background:rgba(34,211,238,.08)}

/* chart + RSI strip */
.chart{position:relative;flex:1 1 auto;min-height:90px;margin-top:4px}
canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.rsi{position:relative;flex:0 0 auto;height:58px;border-top:1px solid rgba(148,163,184,.14)}
.rsi.col{height:30px}
.l .rsi{height:46px}.l .rsi.col{height:28px}
.rt{position:absolute;left:0;top:0;z-index:2;height:44px;min-width:44px;padding:0 2px;border:0;background:none;display:inline-flex;align-items:center}
.rsi.col .rt{top:-14px}.l .rsi.col .rt{top:-16px}
.rtv{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:999px;background:rgba(2,6,23,.8);border:1px solid #1e293b;color:#94a3b8;font-size:10.5px;font-weight:600}
.rtv b{color:#c4b5fd}
.rtv svg{width:8px;height:8px;display:block}
.rsi.col .rtv svg{transform:rotate(180deg)}
</style>
</head>
<body>
<div id="app" class="app"></div>
<script>
(function () {
'use strict';
var APS = [
  {id:'A', short:'Tail', name:'Range-row tail', line:'TA is pinned to the end of the range row, so row 2 (assets and chart type) stays exactly as today and no chart height is lost.'},
  {id:'B', short:'Lane', name:'One swipe lane', line:'Chart type and asset chips share one swipe lane on row 2 with TA pinned at its end: no height lost, but assets sit further along the swipe.'},
  {id:'C', short:'Picker', name:'Compact chart-type picker', line:'Line / 1H / 4H / Candles fold into one picker pill, so row 2 is assets + picker + TA: most room, but changing type takes two taps.'},
  {id:'D', short:'Row 3', name:'Third toolbar row', line:'Chart type moves to its own third row with TA and chips for what is on: roomiest and clearest, but the chart is 38px shorter all the time.'}
];
var RANGES = ['1D','5D','1M','3M','6M','YTD','1Y','5Y','Max'];
var CTYPES = ['Line','1H','4H','Candles'];
var ASSETS = [
  {id:'SPX', name:'S&amp;P 500', color:'#c4b5fd', mult:0.35},
  {id:'GOLD', name:'Gold', color:'#facc15', mult:0.3},
  {id:'MSTR', name:'MSTR', color:'#f97316', mult:1.7}
];
var CFG = {
  '1D':{start:71560, vol:0.0013, span:0.01, x:['3 PM','9 PM','3 AM','9 AM','3 PM']},
  '5D':{start:73900, vol:0.0026, span:0.02, x:['Mon','Tue','Wed','Thu','Fri']},
  '1M':{start:81200, vol:0.005, span:0.04, x:['Oct 14','Oct 21','Oct 28','Nov 4','Nov 13']},
  '3M':{start:61400, vol:0.01, span:0.08, x:['Aug','Sep','Oct','Nov']},
  '6M':{start:57800, vol:0.013, span:0.12, x:['May','Jul','Sep','Nov']},
  'YTD':{start:42300, vol:0.016, span:0.18, x:['Jan','Mar','May','Jul','Sep','Nov']},
  '1Y':{start:36800, vol:0.02, span:0.2, x:['Dec','Mar','Jun','Sep','Nov']},
  '5Y':{start:9800, vol:0.04, span:0.6, x:['2022','2023','2024','2025','2026']},
  'Max':{start:135, vol:0.08, span:1.5, x:['2013','2016','2019','2022','2026']}
};
var END = 68996, PREV = 71560, N = 240;
var FONT = '-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif';

/* ---------- fake data + TA maths ---------- */
function rng(seed){ var a = seed >>> 0; return function(){ a = (a + 0x6d2b79f5) >>> 0; var t = a;
  t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function gauss(r){ var u = Math.max(1e-9, r()), v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
function bridge(r, n, a, b, vol){ var w = [0], i; for (i = 1; i < n; i++) w.push(w[i-1] + gauss(r) * vol);
  var la = Math.log(a), lb = Math.log(b), out = [];
  for (i = 0; i < n; i++){ var t = i / (n - 1); out.push(Math.exp(la + (lb - la) * t + w[i] - t * w[n-1])); } return out; }
var cache = {};
function getData(range){
  if (cache[range]) return cache[range];
  var k = RANGES.indexOf(range), c = CFG[range], r = rng(1009 + k * 7919);
  var s = bridge(r, N, c.start, END, c.vol);
  var perf = {SPX: c.span*0.5*(r()*1.4-0.2), GOLD: c.span*0.4*(r()*1.6-0.6), MSTR: c.span*1.8*(r()*2-0.8)};
  var comps = {};
  ASSETS.forEach(function(a){ var raw = bridge(r, N, 1, Math.max(0.05, 1 + perf[a.id]), c.vol * a.mult);
    comps[a.id] = raw.map(function(v){ return v * s[0]; }); });
  var d = {s: s, comps: comps, bb: boll(s, 20, 2), rsi: rsiCalc(s, 14), ma: {}};
  cache[range] = d; return d;
}
function sma(a, p){ var o = [], sum = 0; for (var i = 0; i < a.length; i++){ sum += a[i]; if (i >= p) sum -= a[i-p]; o.push(i >= p-1 ? sum/p : NaN); } return o; }
function ema(a, p){ var k = 2/(p+1), o = []; for (var i = 0; i < a.length; i++) o.push(i === 0 ? a[0] : a[i]*k + o[i-1]*(1-k)); return o; }
function maOf(d, kind, per){ var key = kind + per; if (!d.ma[key]) d.ma[key] = kind === 'SMA' ? sma(d.s, per) : ema(d.s, per); return d.ma[key]; }
function boll(a, p, m){ var mid = sma(a, p), up = [], lo = [];
  for (var i = 0; i < a.length; i++){ if (i < p-1){ up.push(NaN); lo.push(NaN); continue; }
    var s = 0; for (var j = i-p+1; j <= i; j++) s += (a[j]-mid[i])*(a[j]-mid[i]);
    var sd = Math.sqrt(s/p); up.push(mid[i] + m*sd); lo.push(mid[i] - m*sd); }
  return {up: up, lo: lo, mid: mid}; }
function rsiCalc(a, p){ var o = a.map(function(){ return NaN; }); if (a.length <= p) return o;
  var g = 0, l = 0, i, d; for (i = 1; i <= p; i++){ d = a[i]-a[i-1]; if (d > 0) g += d; else l -= d; }
  g /= p; l /= p; o[p] = l === 0 ? 100 : 100 - 100/(1 + g/l);
  for (i = p+1; i < a.length; i++){ d = a[i]-a[i-1]; g = (g*(p-1) + Math.max(d,0))/p; l = (l*(p-1) + Math.max(-d,0))/p; o[i] = l === 0 ? 100 : 100 - 100/(1 + g/l); }
  return o; }
function pivots(a, w, high){ var o = []; for (var i = w; i < a.length - w; i++){ var ok = true;
  for (var j = i-w; j <= i+w; j++){ if (j !== i && (high ? a[j] > a[i] : a[j] < a[i])){ ok = false; break; } } if (ok) o.push(i); } return o; }
function candles(a, B){ var n = a.length, o = [];
  for (var b = 0; b < B; b++){ var i0 = Math.floor(b*n/B), i1 = Math.floor((b+1)*n/B) - 1, op = a[Math.max(0, i0-1)], hi = op, lo = op;
    for (var i = i0; i <= i1; i++){ hi = Math.max(hi, a[i]); lo = Math.min(lo, a[i]); }
    var wk = (hi - lo) * 0.15; o.push({i0:i0, i1:i1, o:op, h:hi + wk*((b*37)%7)/7, l:lo - wk*((b*53)%5)/5, c:a[i1]}); }
  return o; }
function niceNum(x){ var e = Math.floor(Math.log10(x)), f = x/Math.pow(10, e); return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * Math.pow(10, e); }
function fmtP(v, step){ if (v >= 1000) return step < 1000 ? '$' + (v/1000).toFixed(1) + 'k' : '$' + Math.round(v/1000) + 'k'; return '$' + Math.round(v); }
function pathOf(ctx, X, Y, a){ ctx.beginPath(); var pen = false;
  for (var i = 0; i < a.length; i++){ var v = a[i]; if (!isFinite(v)){ pen = false; continue; }
    if (!pen){ ctx.moveTo(X(i), Y(v)); pen = true; } else ctx.lineTo(X(i), Y(v)); } }

/* ---------- drawing ---------- */
function drawChart(ctx, w, h, land){
  var d = getData(S.range), ta = S.ta, s = d.s, n = s.length;
  var padL = land ? 40 : 44, padR = 8, padT = 8, padB = 20, pw = w - padL - padR, ph = h - padT - padB;
  if (pw < 30 || ph < 30) return;
  var X = function(i){ return padL + (i/(n-1))*pw; };
  var cs = S.ct === 'Candles' ? candles(s, 30) : [];
  var comps = ASSETS.filter(function(a){ return S.assets[a.id]; }).map(function(a){ return {c:a.color, v:d.comps[a.id]}; });
  var ma = ta.ma ? maOf(d, ta.kind, ta.per) : null;
  var lo = Infinity, hi = -Infinity;
  var acc = function(v){ if (!isFinite(v)) return; if (v < lo) lo = v; if (v > hi) hi = v; };
  if (cs.length) cs.forEach(function(c){ acc(c.h); acc(c.l); }); else s.forEach(acc);
  comps.forEach(function(c){ c.v.forEach(acc); });
  if (ta.bb){ d.bb.up.forEach(acc); d.bb.lo.forEach(acc); }
  if (ma) ma.forEach(acc);
  var span = (hi - lo) || 1; lo -= span*0.06; hi += span*0.06;
  var Y = function(v){ return padT + (1 - (v - lo)/(hi - lo))*ph; };
  ctx.font = '500 ' + (land ? 10 : 11) + 'px ' + FONT;
  var step = niceNum((hi - lo)/4);
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (var t = Math.ceil(lo/step)*step; t <= hi; t += step){
    var y = Math.round(Y(t)) + 0.5;
    ctx.strokeStyle = 'rgba(148,163,184,0.10)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
    ctx.fillStyle = '#64748b'; ctx.fillText(fmtP(t, step), padL - 6, y);
  }
  ctx.textBaseline = 'alphabetic';
  var xl = CFG[S.range].x;
  xl.forEach(function(lab, k){ ctx.textAlign = k === 0 ? 'left' : k === xl.length-1 ? 'right' : 'center'; ctx.fillText(lab, padL + (k/(xl.length-1))*pw, h - 5); });
  if (ta.bb){
    ctx.beginPath(); var first = true, i, v;
    for (i = 0; i < n; i++){ v = d.bb.up[i]; if (!isFinite(v)) continue; if (first){ ctx.moveTo(X(i), Y(v)); first = false; } else ctx.lineTo(X(i), Y(v)); }
    for (i = n-1; i >= 0; i--){ v = d.bb.lo[i]; if (isFinite(v)) ctx.lineTo(X(i), Y(v)); }
    ctx.closePath(); ctx.fillStyle = 'rgba(167,139,250,0.10)'; ctx.fill();
    ctx.strokeStyle = 'rgba(167,139,250,0.85)'; ctx.lineWidth = 1;
    pathOf(ctx, X, Y, d.bb.up); ctx.stroke(); pathOf(ctx, X, Y, d.bb.lo); ctx.stroke();
    ctx.setLineDash([3,3]); ctx.strokeStyle = 'rgba(167,139,250,0.55)'; pathOf(ctx, X, Y, d.bb.mid); ctx.stroke(); ctx.setLineDash([]);
  }
  comps.forEach(function(c){ ctx.strokeStyle = c.c; ctx.lineWidth = 1.5; pathOf(ctx, X, Y, c.v); ctx.stroke(); });
  ctx.lineJoin = 'round';
  if (cs.length){
    var bw = Math.max(2, (pw/cs.length)*0.62);
    cs.forEach(function(c){ var x = X((c.i0 + c.i1)/2), col = c.c >= c.o ? '#22c55e' : '#ef4444';
      ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, Y(c.h)); ctx.lineTo(x, Y(c.l)); ctx.stroke();
      var y1 = Y(Math.max(c.o, c.c)), y2 = Y(Math.min(c.o, c.c)); ctx.fillRect(x - bw/2, y1, bw, Math.max(1, y2 - y1)); });
  } else {
    var st = S.ct === '1H' ? 4 : S.ct === '4H' ? 12 : 1, idx = [];
    for (var j = 0; j < n; j += st) idx.push(j); if (idx[idx.length-1] !== n-1) idx.push(n-1);
    var trace = function(){ idx.forEach(function(i, k){ var x = X(i), yy = Y(s[i]); if (k === 0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy); }); };
    ctx.beginPath(); trace(); ctx.lineTo(X(n-1), padT + ph); ctx.lineTo(X(0), padT + ph); ctx.closePath();
    var g = ctx.createLinearGradient(0, padT, 0, padT + ph); g.addColorStop(0, 'rgba(34,211,238,0.22)'); g.addColorStop(1, 'rgba(34,211,238,0)');
    ctx.fillStyle = g; ctx.fill();
    ctx.beginPath(); trace(); ctx.strokeStyle = '#22d3ee'; ctx.lineWidth = S.ct === 'Line' ? 1.8 : 2; ctx.stroke();
    if (S.ct !== 'Line'){ ctx.fillStyle = '#22d3ee'; idx.forEach(function(i){ ctx.beginPath(); ctx.arc(X(i), Y(s[i]), 1.7, 0, Math.PI*2); ctx.fill(); }); }
    ctx.beginPath(); ctx.arc(X(n-1), Y(s[n-1]), 6, 0, Math.PI*2); ctx.fillStyle = 'rgba(34,211,238,0.25)'; ctx.fill();
    ctx.beginPath(); ctx.arc(X(n-1), Y(s[n-1]), 3.2, 0, Math.PI*2); ctx.fillStyle = '#22d3ee'; ctx.fill();
  }
  if (ma){ ctx.strokeStyle = '#f472b6'; ctx.lineWidth = 2; pathOf(ctx, X, Y, ma); ctx.stroke(); }
  if (ta.trend){
    var tl = function(p, col){ if (p.length < 2) return; var a = p[p.length-2], b = p[p.length-1], slope = (s[b] - s[a])/(b - a);
      ctx.save(); ctx.beginPath(); ctx.rect(padL, padT, pw, ph); ctx.clip();
      ctx.strokeStyle = col; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(X(a), Y(s[a])); ctx.lineTo(X(n-1), Y(s[a] + slope*(n-1-a))); ctx.stroke();
      ctx.fillStyle = col; [a, b].forEach(function(i){ ctx.beginPath(); ctx.arc(X(i), Y(s[i]), 3, 0, Math.PI*2); ctx.fill(); });
      ctx.restore(); };
    tl(pivots(s, 14, true), '#f87171'); tl(pivots(s, 14, false), '#22c55e');
  }
}
function drawRsi(ctx, w, h, land){
  var vals = getData(S.range).rsi, padL = land ? 40 : 44, padR = 8, n = vals.length, pw = w - padL - padR;
  if (pw < 30 || h < 10) return;
  var X = function(i){ return padL + (i/(n-1))*pw; }, Y = function(v){ return 4 + (1 - v/100)*(h - 8); };
  ctx.fillStyle = 'rgba(167,139,250,0.07)'; ctx.fillRect(padL, Y(70), pw, Y(30) - Y(70));
  ctx.setLineDash([3,3]); ctx.strokeStyle = 'rgba(148,163,184,0.28)'; ctx.lineWidth = 1;
  [70, 30].forEach(function(v){ ctx.beginPath(); ctx.moveTo(padL, Y(v)); ctx.lineTo(w - padR, Y(v)); ctx.stroke(); });
  ctx.setLineDash([]); ctx.strokeStyle = '#a78bfa'; ctx.lineWidth = 1.5; pathOf(ctx, X, Y, vals); ctx.stroke();
}

/* ---------- state ---------- */
var S = {ap:'A', ovr:null, range:'1D', ct:'Line', assets:{SPX:false, GOLD:false, MSTR:false},
  ta:{trend:false, bb:false, ma:false, kind:'SMA', per:50, rsi:false}, rsiCol:false, taOpen:false, typeOpen:false, keep:true, price:END};
var app = document.getElementById('app'), scale = 1, lastActual = null;
function isPhone(){ return Math.min(window.innerWidth, window.innerHeight) <= 500; }
function actual(){ return isPhone() && window.innerWidth > window.innerHeight ? 'l' : 'p'; }
function mode(){ return S.ovr || actual(); }
function tz(opts){ opts.timeZone = 'America/Toronto'; return opts; }
function dateStr(){ return new Date().toLocaleString('en-US', tz({weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit', second:'2-digit'})) + ' ET'; }
function timeStr(){ return new Date().toLocaleTimeString('en-US', tz({hour:'numeric', minute:'2-digit', second:'2-digit'})); }
function taCount(){ var t = S.ta; return (t.trend?1:0) + (t.bb?1:0) + (t.ma?1:0) + (t.rsi?1:0); }

/* ---------- markup ---------- */
var CHEV = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5l3 3 3-3" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function on(b){ return b ? ' on' : ''; }
function switches(){
  var aps = APS.map(function(a){ return '<button class="ab' + on(a.id === S.ap) + '" data-act="ap" data-v="' + a.id + '" aria-pressed="' + (a.id === S.ap) + '" title="' + a.name + '"><b>' + a.id + '</b><span> · ' + a.short + '</span></button>'; }).join('');
  var m = mode();
  var ors = '<button class="ob' + on(m === 'p') + '" data-act="or" data-v="p" aria-label="Upright" title="Upright"><i class="ip"></i></button>' +
            '<button class="ob' + on(m === 'l') + '" data-act="or" data-v="l" aria-label="Sideways" title="Sideways"><i class="il"></i></button>';
  return {aps: '<div class="apz" role="group" aria-label="Approach">' + aps + '</div>', ors: '<div class="orz" role="group" aria-label="Orientation">' + ors + '</div>'};
}
function rangeChips(){ return RANGES.map(function(r){ return '<button class="ch' + on(r === S.range) + '" data-act="range" data-v="' + r + '">' + r + '</button>'; }).join(''); }
function assetChips(){
  return '<span class="ch as on"><i style="background:#22d3ee"></i>BTC</span>' + ASSETS.map(function(a){ var o = S.assets[a.id];
    return '<button class="ch as' + on(o) + '" data-act="asset" data-v="' + a.id + '" aria-pressed="' + o + '"><i style="background:' + a.color + '"></i>' + (o ? a.name : '+ ' + a.name) + '</button>'; }).join(''); }
function typeChips(){ return CTYPES.map(function(c){ return '<button class="ch' + on(c === S.ct) + '" data-act="ct" data-v="' + c + '">' + c + '</button>'; }).join(''); }
function item(k, name, sub, color){
  return '<button class="it" data-act="flip" data-v="' + k + '" aria-pressed="' + S.ta[k] + '"><span class="nm"><span><i style="background:' + color + '"></i>' + name + '</span><small>' + sub + '</small></span><span class="sw' + on(S.ta[k]) + '"></span></button>'; }
function panel(){
  var t = S.ta;
  return '<div class="pn" data-panel>' +
    '<div class="ph"><b>Technical analysis</b><button data-act="clear">Clear all</button></div><div class="pg">' +
    item('trend', 'Smart Trendlines', 'auto support / resistance', '#22c55e') +
    item('bb', 'Bollinger Bands', '20 · 2σ', '#a78bfa') +
    item('ma', 'Moving average', 'one at a time', '#f472b6') +
    '<div class="ma' + (t.ma ? '' : ' off') + '"><span class="seg">' +
      ['SMA','EMA'].map(function(k){ return '<button class="' + (t.kind === k ? 'on' : '') + '" data-act="kind" data-v="' + k + '">' + k + '</button>'; }).join('') +
    '</span><span class="seg">' +
      [20,50,200].map(function(p){ return '<button class="' + (t.per === p ? 'on' : '') + '" data-act="per" data-v="' + p + '">' + p + '</button>'; }).join('') +
    '</span></div>' +
    item('rsi', 'RSI', '14 · strip under chart', '#a78bfa') +
    '</div></div>'; }
function taPill(){ var c = taCount();
  return '<span class="tw" data-taw><button class="ch ta' + (c ? ' act' : '') + (S.taOpen ? ' open' : '') + '" data-act="ta" aria-expanded="' + S.taOpen + '">TA' +
    (c ? '<em class="n">' + c + '</em>' : CHEV) + '</button>' + (S.taOpen ? panel() : '') + '</span>'; }
function typePicker(){
  return '<span class="tw" data-tyw><button class="ch typ' + (S.typeOpen ? ' open' : '') + '" data-act="typ" aria-expanded="' + S.typeOpen + '">' + S.ct + CHEV + '</button>' +
    (S.typeOpen ? '<div class="tm">' + CTYPES.map(function(c){ return '<button class="tmi' + on(c === S.ct) + '" data-act="ct" data-v="' + c + '"><span>' + c + '</span><span>' + (c === S.ct ? '✓' : '') + '</span></button>'; }).join('') + '</div>' : '') +
    '</span>'; }
function activeChips(){ var t = S.ta, a = [];
  if (t.trend) a.push(['Trendlines', '#22c55e']); if (t.bb) a.push(['Bollinger', '#a78bfa']);
  if (t.ma) a.push([t.kind + ' ' + t.per, '#f472b6']); if (t.rsi) a.push(['RSI 14', '#a78bfa']);
  return a.map(function(x){ return '<span class="ac"><i style="background:' + x[1] + '"></i>' + x[0] + '</span>'; }).join(''); }
function controls(){
  var R = '<div class="row"><div class="lane fade" data-sk="r">' + rangeChips() + '</div>';
  if (S.ap === 'A') return R + taPill() + '</div><div class="row"><div class="lane fade" data-sk="a">' + assetChips() + '</div><div class="grp">' + typeChips() + '</div></div>';
  if (S.ap === 'B') return R + '</div><div class="row"><div class="lane fade" data-sk="b">' + typeChips() + '<span class="dv"></span>' + assetChips() + '</div>' + taPill() + '</div>';
  if (S.ap === 'C') return R + '</div><div class="row"><div class="lane fade" data-sk="a">' + assetChips() + '</div>' + typePicker() + taPill() + '</div>';
  return R + '</div><div class="row"><div class="lane fade" data-sk="a">' + assetChips() + '</div></div>' +
    '<div class="row"><div class="grp">' + typeChips() + '</div><div class="chips" data-sk="c">' + activeChips() + '</div>' + taPill() + '</div>';
}
function priceBlock(){
  return '<div><div class="pl">Bitcoin · USD · Live price</div><div class="px"><span>$</span><span style="color:inherit" data-px></span></div>' +
    '<div class="cg"><span data-chg></span><span class="mut"> · Updated <span data-upd></span></span></div></div>'; }
function chartBits(){
  var rsi = '';
  if (S.ta.rsi){ var v = getData(S.range).rsi, last = Math.round(v[v.length-1]);
    rsi = '<div class="rsi' + (S.rsiCol ? ' col' : '') + '">' + (S.rsiCol ? '' : '<canvas data-cv="rsi"></canvas>') +
      '<button class="rt" data-act="rsicol" aria-expanded="' + !S.rsiCol + '"><span class="rtv">RSI 14 · <b>' + last + '</b>' + CHEV + '</span></button></div>'; }
  return '<div class="chart"><canvas data-cv="chart"></canvas></div>' + rsi; }
function keepBtn(){ return '<button class="keep' + on(S.keep) + '" data-act="keep" aria-pressed="' + S.keep + '">Keep screen on</button>'; }
var PROTO = '<span class="proto">Prototype · fake data</span>';
function portrait(){
  var sw = switches(), ap = APS.filter(function(a){ return a.id === S.ap; })[0];
  return '<div class="bar"><div class="b1">' + sw.aps + sw.ors + '</div><p class="desc"><b>' + ap.id + ' · ' + ap.name + '.</b> ' + ap.line + '</p></div>' +
    '<div class="hd"><div class="br"><span class="lg">₿</span><b>Paperstreet <em>BTC</em></b><span class="mut">· Live BTC Chart</span></div>' +
    '<div class="lv"><span class="dot"></span><span class="ok">LIVE · AUTO</span><span class="sp"></span>' + keepBtn() + '</div>' +
    '<div class="dr"><span class="dt" data-date></span>' + PROTO + '</div></div>' +
    '<div class="card">' + priceBlock() + controls() + chartBits() + '</div>'; }
function landscape(){
  var sw = switches();
  return '<div class="rail">' + sw.aps + sw.ors + '</div><div class="main">' +
    '<div class="hd"><div class="br"><span class="lg">₿</span><b>Paperstreet <em>BTC</em></b></div><span class="dot"></span><span class="ok">LIVE · AUTO</span>' + keepBtn() +
    '<span class="sp"></span>' + PROTO + '<span class="dt" data-time></span></div>' +
    '<div class="card"><div class="lc">' + priceBlock() + '</div><div class="rc">' + controls() + chartBits() + '</div></div></div>'; }

/* ---------- render ---------- */
function tick(){
  var chg = (S.price/PREV - 1)*100, t = timeStr();
  app.querySelectorAll('[data-px]').forEach(function(el){ el.textContent = S.price.toLocaleString('en-US'); });
  app.querySelectorAll('[data-chg]').forEach(function(el){ el.className = chg < 0 ? 'dn' : 'up'; el.textContent = (chg < 0 ? '▼ ' : '▲ ') + Math.abs(chg).toFixed(1) + '% · 24h'; });
  app.querySelectorAll('[data-upd]').forEach(function(el){ el.textContent = t; });
  app.querySelectorAll('[data-date]').forEach(function(el){ el.textContent = dateStr(); });
  app.querySelectorAll('[data-time]').forEach(function(el){ el.textContent = t + ' ET'; });
}
function paint(){
  var land = mode() === 'l', dpr = Math.min(3, window.devicePixelRatio || 1);
  app.querySelectorAll('canvas[data-cv]').forEach(function(cv){
    var w = cv.clientWidth, h = cv.clientHeight; if (w < 2 || h < 2) return;
    cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
    var ctx = cv.getContext('2d'); if (!ctx) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
    if (cv.getAttribute('data-cv') === 'chart') drawChart(ctx, w, h, land); else drawRsi(ctx, w, h, land);
  });
  var pn = app.querySelector('[data-panel]');
  if (pn){ var ar = app.getBoundingClientRect(), pr = pn.getBoundingClientRect();
    pn.style.maxHeight = Math.max(120, Math.floor((ar.bottom - pr.top)/scale - 8)) + 'px'; }
}
function render(){
  var m = mode(), land = m === 'l', fill = isPhone() && m === actual();
  var sc = {}; app.querySelectorAll('[data-sk]').forEach(function(el){ sc[el.getAttribute('data-sk')] = el.scrollLeft; });
  var pnScroll = app.querySelector('[data-panel]'); var pnTop = pnScroll ? pnScroll.scrollTop : 0;
  app.className = 'app ' + (land ? 'l' : 'p') + (fill ? ' fill' : ' frame');
  if (fill){ scale = 1; app.style.cssText = ''; }
  else { var W = land ? 852 : 393, H = land ? 393 : 852, pad = isPhone() ? 0 : 24;
    scale = Math.min(1, (window.innerWidth - pad)/W, (window.innerHeight - pad)/H);
    app.style.cssText = 'width:' + W + 'px;height:' + H + 'px;transform:scale(' + scale + ');left:' + Math.max(0, (window.innerWidth - W*scale)/2) + 'px;top:' + Math.max(0, (window.innerHeight - H*scale)/2) + 'px';
  }
  app.innerHTML = land ? landscape() : portrait();
  app.querySelectorAll('[data-sk]').forEach(function(el){ var k = el.getAttribute('data-sk'); if (sc[k]) el.scrollLeft = sc[k]; });
  tick(); paint();
  var pn = app.querySelector('[data-panel]'); if (pn && pnTop) pn.scrollTop = pnTop;
}

/* ---------- events ---------- */
app.addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('[data-act]') : null; if (!b || !app.contains(b)) return;
  var a = b.getAttribute('data-act'), v = b.getAttribute('data-v');
  switch (a){
    case 'ap': S.ap = v; S.taOpen = S.typeOpen = false; break;
    case 'or': S.ovr = (isPhone() && v === actual()) ? null : (!isPhone() && v === 'p' ? null : v); S.taOpen = S.typeOpen = false; break;
    case 'range': S.range = v; break;
    case 'asset': S.assets[v] = !S.assets[v]; break;
    case 'ct': S.ct = v; S.typeOpen = false; break;
    case 'ta': S.taOpen = !S.taOpen; S.typeOpen = false; break;
    case 'typ': S.typeOpen = !S.typeOpen; S.taOpen = false; break;
    case 'flip': S.ta[v] = !S.ta[v]; if (v === 'rsi') S.rsiCol = false; break;
    case 'clear': S.ta.trend = S.ta.bb = S.ta.ma = S.ta.rsi = false; break;
    case 'kind': S.ta.kind = v; S.ta.ma = true; break;
    case 'per': S.ta.per = +v; S.ta.ma = true; break;
    case 'rsicol': S.rsiCol = !S.rsiCol; break;
    case 'keep': S.keep = !S.keep; break;
    default: return;
  }
  render();
});
/* outside tap closes the TA panel and the chart-type menu */
document.addEventListener('pointerdown', function(e){
  var t = e.target, ch = false;
  if (S.taOpen && !(t.closest && t.closest('[data-taw]'))){ S.taOpen = false; ch = true; }
  if (S.typeOpen && !(t.closest && t.closest('[data-tyw]'))){ S.typeOpen = false; ch = true; }
  if (ch) render();
}, true);
var raf = 0;
function onResize(){
  var a = actual(); if (lastActual !== null && a !== lastActual) S.ovr = null; lastActual = a;
  cancelAnimationFrame(raf); raf = requestAnimationFrame(render);
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', onResize);
setInterval(function(){ S.price = Math.min(END + 400, Math.max(END - 400, Math.round(S.price + (Math.random() - 0.5)*30))); tick(); }, 2500);
lastActual = actual();
render();
window.__ps = {S: S, render: render, mode: mode};
})();
</script>
